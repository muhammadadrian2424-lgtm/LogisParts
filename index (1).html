<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogisParts — Rantau Logistics System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg0:#080C14;--bg1:#0D1220;--bg2:#131A2E;--bg3:#1A2340;--bg4:#212D50;--b1:#1E2B4A;--b2:#2A3A60;--b3:#354878;--t1:#EFF3FB;--t2:#9AADCC;--t3:#5E7499;--blue:#4B8DF8;--cyan:#22D3EE;--green:#34D399;--amber:#FBBF24;--red:#F87171;--purple:#A78BFA;--r:10px;--rs:6px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg0);color:var(--t1);overflow-x:hidden;}
.mono{font-family:'IBM Plex Mono',monospace;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg0);}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px;}
::selection{background:rgba(75,141,248,.3);}

/* ====== LOGIN ====== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg0);background-image:radial-gradient(ellipse at 30% 20%,rgba(75,141,248,.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(34,211,238,.06) 0%,transparent 50%);}
.login-box{background:var(--bg2);border:1px solid var(--b1);border-radius:16px;padding:40px;width:380px;max-width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fi .4s ease;}
.login-box h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px;}
.login-box h1 span{background:linear-gradient(135deg,#4B8DF8,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.login-box .sub{text-align:center;font-size:11px;color:var(--t3);margin-bottom:28px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.login-field input{width:100%;background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:12px 14px;color:var(--t1);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s;}
.login-field input:focus{border-color:var(--blue);}
.login-btn{width:100%;padding:12px;border:none;border-radius:var(--rs);background:linear-gradient(135deg,#4B8DF8,#3A75D8);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(75,141,248,.3);}
.login-err{color:var(--red);font-size:11px;text-align:center;margin-top:10px;}
.login-hint{margin-top:20px;padding:14px;background:var(--bg1);border-radius:var(--rs);border:1px solid var(--b1);}
.login-hint p{font-size:9px;color:var(--t3);margin-bottom:4px;}
.login-hint .acc{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;color:var(--t2);}
.login-hint .acc span:first-child{color:var(--cyan);font-weight:600;font-family:'IBM Plex Mono',monospace;}

/* ====== SHELL ====== */
.shell{display:flex;min-height:100vh;}
.side{width:230px;background:var(--bg1);border-right:1px solid var(--b1);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;z-index:90;transition:transform .3s;}
.side-brand{padding:16px 14px;border-bottom:1px solid var(--b1);}
.side-brand h1{font-size:14px;font-weight:800;background:linear-gradient(135deg,#4B8DF8,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.side-brand span{font-size:9px;color:var(--t3);display:block;margin-top:2px;text-transform:uppercase;letter-spacing:.08em;}
.side-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.snav{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--rs);cursor:pointer;font-size:11px;font-weight:600;color:var(--t3);border:1px solid transparent;transition:all .15s;user-select:none;}
.snav:hover{background:var(--bg2);color:var(--t2);}
.snav.on{background:rgba(75,141,248,.1);color:var(--blue);border-color:rgba(75,141,248,.2);}
.snav-ico{width:28px;height:28px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:13px;}
.snav.on .snav-ico{background:rgba(75,141,248,.15);}
.snav.locked{opacity:.35;cursor:not-allowed;}
.side-user{padding:10px;border-top:1px solid var(--b1);}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);}
.user-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.side-foot{padding:8px;border-top:1px solid var(--b1);}
.logout-btn{width:100%;padding:8px;border:1px solid rgba(248,113,113,.2);border-radius:var(--rs);background:rgba(248,113,113,.06);color:var(--red);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(248,113,113,.12);}

.content{margin-left:230px;flex:1;padding:20px;min-width:0;}
.pg-hd{margin-bottom:16px;display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:10px;}
.pg-hd h2{font-size:20px;font-weight:800;letter-spacing:-.02em;}
.pg-hd p{font-size:11px;color:var(--t3);margin-top:3px;}

.cd{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.cd-t{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:14px;}
.st{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:12px;}
.st-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.st-v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em;}
.st-s{font-size:9px;color:var(--t3);margin-top:2px;}

.dtb{width:100%;border-collapse:collapse;font-size:11px;}
.dtb th{text-align:left;padding:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);border-bottom:1px solid var(--b1);background:rgba(0,0,0,.15);}
.dtb td{padding:8px;border-bottom:1px solid rgba(30,43,74,.5);}
.dtb tbody tr:hover{background:var(--bg3);}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rs);border:none;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-p{background:linear-gradient(135deg,#4B8DF8,#3A75D8);color:#fff;}.btn-p:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(75,141,248,.3);}
.btn-g{background:var(--bg3);color:var(--t2);border:1px solid var(--b1);}.btn-g:hover{border-color:var(--b2);}
.btn-d{background:rgba(248,113,113,.1);color:var(--red);}.btn-d:hover{background:rgba(248,113,113,.18);}
.btn-grn{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2);}
.btn-sm{padding:4px 8px;font-size:9px;}
.badge{display:inline-flex;padding:3px 7px;border-radius:10px;font-size:9px;font-weight:700;}

.fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r);}
.fbar input,.fbar select{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);padding:6px 8px;color:var(--t1);font-family:inherit;font-size:11px;outline:none;max-width:160px;}
.fbar select option{background:var(--bg1);}

.cpb{height:4px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:3px;}
.cpf{height:100%;border-radius:2px;transition:width .5s ease;}

.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.sd{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);padding:7px;min-height:90px;cursor:pointer;transition:all .15s;}
.sd:hover{border-color:var(--b2);}
.sd.today{border-color:var(--blue);box-shadow:0 0 10px rgba(75,141,248,.1);}
.sd-n{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:4px;}
.sd-v{padding:2px 5px;border-radius:3px;font-size:8px;font-weight:700;display:block;margin-top:2px;text-align:center;}

.tog{width:36px;height:20px;border-radius:10px;background:var(--b1);cursor:pointer;position:relative;transition:background .3s;flex-shrink:0;display:inline-block;}
.tog.on{background:var(--amber);}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s;}
.tog.on::after{transform:translateX(16px);}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
.ml{background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r);padding:20px;max-width:720px;width:95%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);}
.ml h3{font-size:15px;font-weight:700;margin-bottom:14px;}

.audit{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--t3);padding:6px 10px;background:rgba(75,141,248,.05);border:1px solid rgba(75,141,248,.1);border-radius:var(--rs);margin-top:10px;}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t2);}.leg-d{width:9px;height:9px;border-radius:2px;display:inline-block;}

.split-bx{background:rgba(75,141,248,.06);border:1px solid rgba(75,141,248,.18);border-radius:var(--r);padding:12px;margin-top:12px;}
.tl{position:relative;padding-left:20px;}.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--b2);}
.tl-i{position:relative;margin-bottom:12px;}.tl-d{position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;border:3px solid;background:var(--bg0);}

.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;}
.field input,.field select,.field textarea{background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:8px 10px;color:var(--t1);font-family:inherit;font-size:12px;outline:none;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field select option{background:var(--bg1);}
.field textarea{resize:vertical;min-height:60px;}

.no-access{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--t3);}
.no-access span{font-size:48px;margin-bottom:16px;}

.xg{overflow-x:auto;border:1px solid var(--b1);border-radius:var(--rs);background:var(--bg1);}
.xg table{width:100%;border-collapse:collapse;font-size:11px;min-width:700px;}
.xg th{background:var(--bg3);padding:7px 5px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);border:1px solid var(--b1);text-align:center;}
.xg td{padding:1px;border:1px solid var(--b1);vertical-align:middle;}
.xg td.rn{background:var(--bg3);text-align:center;font-size:9px;font-weight:700;color:var(--t3);width:28px;}
.xg input,.xg select{width:100%;background:transparent;border:none;color:var(--t1);font-family:inherit;font-size:11px;padding:6px 7px;outline:none;}
.xg input:focus,.xg select:focus{background:rgba(75,141,248,.08);box-shadow:inset 0 0 0 1.5px var(--blue);}
.xg select{cursor:pointer;font-size:10px;}.xg select option{background:var(--bg1);}

.xdd{position:absolute;left:0;top:100%;right:0;background:var(--bg1);border:1px solid var(--b2);border-radius:0 0 var(--rs) var(--rs);max-height:160px;overflow-y:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.6);}
.xdd-i{padding:7px 9px;cursor:pointer;border-bottom:1px solid var(--b1);font-size:10px;}.xdd-i:hover{background:var(--bg3);}

.export-wrap{position:relative;display:inline-block;}
.export-dd{position:absolute;right:0;top:100%;margin-top:4px;background:var(--bg1);border:1px solid var(--b2);border-radius:var(--rs);padding:4px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:120;display:none;}
.export-dd.show{display:block;}
.export-dd div{padding:7px 10px;cursor:pointer;font-size:11px;font-weight:600;color:var(--t2);border-radius:4px;}
.export-dd div:hover{background:var(--bg3);}

.mob-btn{position:fixed;top:8px;left:8px;z-index:100;display:none!important;}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:7px 12px;background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);}

@keyframes fi{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fi{animation:fi .3s ease forwards;}

@media(max-width:860px){
  .side{transform:translateX(-100%);}
  .side.open{transform:translateX(0);}
  .content{margin-left:0;padding:12px;}
  .sg{grid-template-columns:repeat(4,1fr);}
  .mob-btn{display:block!important;}
}

.hidden{display:none!important;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid-5{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:12px;}
.success-msg{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:var(--r);padding:14px;margin-bottom:14px;text-align:center;font-size:13px;font-weight:700;color:var(--green);}
.warning-box{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);border-radius:var(--rs);padding:8px;margin-bottom:12px;font-size:11px;color:var(--red);}

@media(max-width:700px){
  .grid-2,.grid-3,.grid-5{grid-template-columns:1fr;}
  .stats{grid-template-columns:1fr 1fr;}
}
</style>
</head>

function exportCSV(h,r,fn){const c=[h.join(","),...r.map(r2=>r2.map(c2=>`"${String(c2).replace(/"/g,'""')}"`).join(","))].join("\n");const b=new Blob(["\uFEFF"+c],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn+".csv";a.click();}
function exportJSON(d,fn){const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn+".json";a.click();}

function seedInvoices(){
  const inv=[];const pts=["Filter Oil","Bucket Tooth","Hydraulic Hose","Track Roller","Turbocharger","Alternator","Radiator","Swing Bearing","Final Drive","Fuel Injector"];
  for(let i=1;i<=20;i++){
    const hub=HUBS[Math.floor(Math.random()*2)];const tipe=Math.random()>.45?"Reguler":"Borongan";
    const arm=tipe==="Reguler"?ARMADA[Math.floor(Math.random()*2)+2]:ARMADA[Math.floor(Math.random()*3)+3];
    const d=Math.floor(Math.random()*20)+1;const vendor=VENDORS_LIST[Math.floor(Math.random()*3)];
    const items=Array.from({length:Math.floor(Math.random()*3)+1},()=>{const p=pts[Math.floor(Math.random()*pts.length)];const qty=Math.floor(Math.random()*5)+1;const up=500000+Math.floor(Math.random()*3000000);return{nama:p,qty,unitPrice:up,totalPrice:qty*up,pn:`PN-${Math.floor(Math.random()*9000)+1000}`}});
    const tb=items.reduce((s,it)=>s+it.totalPrice,0);const ok=tipe==="Reguler"?arm.biayaReg:arm.biayaBor;
    inv.push({id:`INV-2026-${String(i).padStart(4,'0')}`,tanggal:`${d<10?"0"+d:d}/03/2026`,hub,tipe,armada:arm.name,armadaId:arm.id,vendor,items,totalBiaya:tb,ongkir:ok,grandTotal:tb+ok,volume:Math.floor(Math.random()*arm.volume*.7)+200,berat:+(Math.random()*arm.weight*.7+.1).toFixed(1),status:STATUS_LIST[Math.floor(Math.random()*5)],lastModBy:["Hub BPP - Ahmad","Hub BJM - Budi","UT Rantau - Dimas","Vendor - Surya"][Math.floor(Math.random()*4)],lastModAt:`${d<10?"0"+d:d}/03/2026 ${Math.floor(Math.random()*12)+8}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`,catatan:Math.random()>.7?"Urgent - unit breakdown":""});
  }
  return inv;
}

function analyzeShipment(items){
  if(!items.length)return null;
  let tV=0,tW=0,mP=0,mL=0,mT=0,hU="low";const uo={critical:0,urgent:1,normal:2,low:3};
  const proc=items.map(it=>{const v=(it.panjang*it.lebar*it.tinggi*it.qty)/1e6;const w=(it.berat*it.qty)/1000;tV+=v;tW+=w;mP=Math.max(mP,it.panjang);mL=Math.max(mL,it.lebar);mT=Math.max(mT,it.tinggi);if(uo[it.urgency]<uo[hU])hU=it.urgency;return{...it,vol:v,wt:w}});
  const allIn=ARMADA.map(a=>{const vp=(tV/a.volume)*100,wp=(tW/a.weight)*100,df=mP<=a.dimMax.p&&mL<=a.dimMax.l&&mT<=a.dimMax.t;return{...a,vp,wp,df,fits:vp<=100&&wp<=100&&df}});
  const best=allIn.filter(a=>a.fits).sort((a,b)=>a.volume-b.volume)[0];
  const uI=proc.filter(i=>i.urgency==="critical"||i.urgency==="urgent");const nI=proc.filter(i=>i.urgency==="normal"||i.urgency==="low");
  let split=null;
  if(uI.length>0&&nI.length>0){let uV=0,uW=0,uP=0,uL2=0,uT=0;uI.forEach(i=>{uV+=i.vol;uW+=i.wt;uP=Math.max(uP,i.panjang);uL2=Math.max(uL2,i.lebar);uT=Math.max(uT,i.tinggi)});let nV=0,nW=0,nP=0,nL2=0,nT=0;nI.forEach(i=>{nV+=i.vol;nW+=i.wt;nP=Math.max(nP,i.panjang);nL2=Math.max(nL2,i.lebar);nT=Math.max(nT,i.tinggi)});const uf=ARMADA.filter(a=>(uV/a.volume)*100<=100&&(uW/a.weight)*100<=100&&uP<=a.dimMax.p&&uL2<=a.dimMax.l&&uT<=a.dimMax.t).sort((a,b)=>a.volume-b.volume)[0];const nf=ARMADA.filter(a=>(nV/a.volume)*100<=100&&(nW/a.weight)*100<=100&&nP<=a.dimMax.p&&nL2<=a.dimMax.l&&nT<=a.dimMax.t).sort((a,b)=>a.volume-b.volume)[0];if(uf&&nf)split={uf,nf,uI,nI,sc:uf.biayaBor+nf.biayaReg,cc:best?best.biayaBor:Infinity,uW,nW}}
  const isReg=best&&(best.id==="cdd_box"||best.id==="cdd_3way");const mode=hU==="critical"?"borongan":hU==="urgent"?(isReg?"reguler_priority":"borongan"):isReg?"reguler":"borongan";
  return{tV,tW,maxDim:{p:mP,l:mL,t:mT},hU,allIn,best,split,mode,proc,uI,nI};
}

function doLogin(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value;
  const found=USERS.find(x=>x.username===u&&x.password===p);
  if(found){
    currentUser=found;
    invoices=seedInvoices();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-shell').classList.remove('hidden');
    buildSidebar();
    navigate('dashboard');
  } else {
    document.getElementById('login-err').classList.remove('hidden');
  }
}

function buildSidebar(){
  const u=currentUser;
  document.getElementById('side-avatar').innerHTML=u.icon;

  document.getElementById('side-avatar').style.color=u.color;

  document.getElementById('side-role').textContent=u.label;
  document.getElementById('top-bar').innerHTML=`<span>${u.icon}</span><span style="font-size:11px;font-weight:700;color:${u.color}">${u.name}</span><span style="font-size:10px;color:var(--t3)">• ${u.label}</span>`;

  let html='';
  NAV.forEach(n=>{
    const ok=canAccess(u.role,n.id);
    html+=`<div class="snav ${currentPage===n.id?'on':''} ${!ok?'locked':''}" data-page="${n.id}" ${ok?`onclick="navigate('${n.id}')"`:''}><div class="snav-ico">${n.icon}</div><div><div style="font-size:11px">${n.label}</div><div style="font-size:8px;color:var(--t3);margin-top:1px">${n.desc}${!ok?' 🔒':''}</div></div></div>`;
  });

function navigate(page){
  currentPage=page;
  buildSidebar();
  document.getElementById('sidebar').classList.remove('open');
  const c=document.getElementById('page-container');
  if(!canAccess(currentUser.role,page)){
    c.innerHTML='<div class="no-access fi"><span>🔒</span><h3 style="font-size:18px;font-weight:700;margin-bottom:8px">Akses Terbatas</h3><p style="font-size:13px">Role Anda tidak memiliki akses ke halaman ini.</p></div>';
    return;
  }
  const renders={dashboard:renderDashboard,invoice:renderInvoice,submit_invoice:renderSubmitInvoice,advisor:renderAdvisor,schedule:renderSchedule,database:renderDatabase};
  if(renders[page])renders[page](c);
}

function renderDashboard(c){
  const totalInv=invoices.length;
  const totalGrand=invoices.reduce((s,i)=>s+i.grandTotal,0);
  const totalOngkir=invoices.reduce((s,i)=>s+i.ongkir,0);

  const selesai=invoices.filter(i=>i.status==="Selesai").length;
  const dalamKirim=invoices.filter(i=>i.status==="Dalam Pengiriman").length;
  const pending=invoices.filter(i=>i.status==="Draft"||i.status==="Menunggu Pickup").length;
  const byStatus=STATUS_LIST.map(s=>({status:s,count:invoices.filter(i=>i.status===s).length}));

  const byVendor=[...new Set(invoices.map(i=>i.vendor))].map(v=>({vendor:v,count:invoices.filter(i=>i.vendor===v).length,total:invoices.filter(i=>i.vendor===v).reduce((s,x)=>s+x.grandTotal,0)})).sort((a,b)=>b.total-a.total);

function renderInvoice(c){
  const role=currentUser.role;
  let fH="Semua",fT="Semua",fS="Semua",q="";

  function build(){
    let filtered=invoices.filter(i=>{
      if(role==="vendor"&&i.vendor!==currentUser.name)return false;
      if(fH!=="Semua"&&i.hub!==fH)return false;
      if(fT!=="Semua"&&i.tipe!==fT)return false;
      if(fS!=="Semua"&&i.status!==fS)return false;
      if(q&&!i.id.toLowerCase().includes(q.toLowerCase())&&!i.items.map(x=>x.nama).join(",").toLowerCase().includes(q.toLowerCase()))return false;
      return true;
    });
    const totG=filtered.reduce((s,i)=>s+i.grandTotal,0);

    let html=`<div class="pg-hd fi"><div><h2>📋 Tracking Invoice</h2><p>Detail per transaksi • ${role==="vendor"?"Invoice vendor Anda":"Semua hub & vendor"}</p></div><div class="export-wrap"><button class="btn btn-grn btn-sm" onclick="this.nextElementSibling.classList.toggle('show')">⬇ Export</button><div class="export-dd"><div onclick="doInvExport('CSV')">CSV</div><div onclick="doInvExport('JSON')">Excel (JSON)</div><div onclick="window.print()">PDF (Print)</div></div></div></div>`;

    // Stats
    const sts=[{l:"Total Invoice",v:filtered.length,c:"var(--blue)"},{l:"Grand Total",v:rpJt(totG),c:"var(--green)"},{l:"Reguler",v:filtered.filter(i=>i.tipe==="Reguler").length,c:"var(--cyan)"},{l:"Borongan",v:filtered.filter(i=>i.tipe==="Borongan").length,c:"var(--amber)"}];
    html+=`<div class="stats fi">`;
    sts.forEach(s=>{html+=`<div class="st" style="border-top:3px solid ${s.c}"><div class="st-l">${s.l}</div><div class="st-v mono" style="font-size:${s.l==='Grand Total'?16:22}px">${s.v}</div></div>`});
    html+=`</div>`;

    // Filters
    html+=`<div class="fbar fi"><input id="inv-q" placeholder="🔍 Cari..." value="${q}" style="flex:1;max-width:none"><select id="inv-fh"><option>Semua</option>${HUBS.map(h=>`<option ${fH===h?'selected':''}>${h}</option>`).join('')}</select><select id="inv-ft"><option>Semua</option><option ${fT==='Reguler'?'selected':''}>Reguler</option><option ${fT==='Borongan'?'selected':''}>Borongan</option></select><select id="inv-fs"><option>Semua</option>${STATUS_LIST.map(s=>`<option ${fS===s?'selected':''}>${s}</option>`).join('')}</select></div>`;

    // Table
    html+=`<div class="cd fi" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="dtb"><thead><tr><th>Invoice</th><th>Tanggal</th><th>Hub</th><th>Tipe</th><th>Armada</th><th>Vendor</th><th>Items</th><th>Grand Total</th><th>Status</th><th>Modified</th></tr></thead><tbody>`;
    filtered.forEach(inv=>{
      const hbg=inv.hub.includes("Balikpapan")?"rgba(75,141,248,.1)":"rgba(167,139,250,.1)";
      const hc=inv.hub.includes("Balikpapan")?"var(--blue)":"var(--purple)";
      const tbg=inv.tipe==="Reguler"?"rgba(34,211,238,.1)":"rgba(251,191,36,.1)";
      const tc=inv.tipe==="Reguler"?"var(--cyan)":"var(--amber)";
      html+=`<tr style="cursor:pointer" onclick="openInvDetail('${inv.id}')"><td><span class="mono" style="color:var(--blue);font-weight:600;font-size:10px">${inv.id}</span></td><td style="font-size:10px">${inv.tanggal}</td><td><span class="badge" style="background:${hbg};color:${hc};font-size:8px">${inv.hub.replace("Hub ","")}</span></td><td><span class="badge" style="background:${tbg};color:${tc};font-size:8px">${inv.tipe}</span></td><td style="font-weight:600;font-size:10px">${inv.armada}</td><td style="font-size:10px;color:var(--t2)">${inv.vendor}</td><td style="font-size:10px">${inv.items.length} item</td><td class="mono" style="font-size:10px;color:var(--green)">${rp(inv.grandTotal)}</td><td><span class="badge" style="background:${stBg(inv.status)};color:${stC(inv.status)};font-size:8px">${inv.status}</span></td><td style="font-size:9px;color:var(--t3)">${inv.lastModBy}</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
    c.innerHTML=html;

    // Bind filters
    document.getElementById('inv-q').oninput=e=>{q=e.target.value;build()};
    document.getElementById('inv-fh').onchange=e=>{fH=e.target.value;build()};
    document.getElementById('inv-ft').onchange=e=>{fT=e.target.value;build()};
    document.getElementById('inv-fs').onchange=e=>{fS=e.target.value;build()};
  }

  // Export function
  window.doInvExport=function(fmt){
    let filtered=invoices.filter(i=>{
      if(role==="vendor"&&i.vendor!==currentUser.name)return false;
      if(fH!=="Semua"&&i.hub!==fH)return false;if(fT!=="Semua"&&i.tipe!==fT)return false;if(fS!=="Semua"&&i.status!==fS)return false;
      if(q&&!i.id.toLowerCase().includes(q.toLowerCase()))return false;return true;
    });
    const h=["Invoice","Tanggal","Hub","Tipe","Armada","Vendor","Items","Grand Total","Status"];
    const r=filtered.map(i=>[i.id,i.tanggal,i.hub,i.tipe,i.armada,i.vendor,i.items.map(x=>x.nama).join("; "),i.grandTotal,i.status]);
    if(fmt==="CSV")exportCSV(h,r,"invoice_pengiriman");else if(fmt==="JSON")exportJSON(filtered,"invoice_pengiriman");else window.print();
    document.querySelectorAll('.export-dd.show').forEach(d=>d.classList.remove('show'));
  };

  // Detail modal
  window.openInvDetail=function(id){
    const inv=invoices.find(i=>i.id===id);if(!inv)return;
    let editSt=inv.status,editTipe=inv.tipe,editArm=inv.armadaId,editNote=inv.catatan||"";

    function buildModal(){
      let mh=`<div style="display:flex;justify-content:space-between;align-items:start"><h3>Detail ${inv.id}</h3><span class="badge" style="background:${stBg(inv.status)};color:${stC(inv.status)}">${inv.status}</span></div>`;
      mh+=`<div class="grid-3" style="margin-bottom:14px;font-size:12px">`;
      [["Tanggal",inv.tanggal],["Hub Asal",inv.hub],["Vendor",inv.vendor],["Volume",inv.volume.toLocaleString()+" m³"],["Berat",inv.berat+" Ton"]].forEach(([l,v])=>{mh+=`<div><div style="font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:3px">${l}</div><div style="font-weight:600">${v}</div></div>`});
      mh+=`</div>`;
      if(inv.catatan)mh+=`<div class="warning-box">⚠️ ${inv.catatan}</div>`;

      // Items table
      mh+=`<div class="cd-t">Detail Item</div><div style="overflow-x:auto;margin-bottom:14px"><table class="dtb"><thead><tr><th>#</th><th>PN</th><th>Nama</th><th>Qty</th><th>Harga</th><th>Total</th></tr></thead><tbody>`;
      inv.items.forEach((it,i)=>{mh+=`<tr><td>${i+1}</td><td class="mono" style="color:var(--cyan);font-size:10px">${it.pn}</td><td>${it.nama}</td><td class="mono">${it.qty}</td><td class="mono" style="font-size:10px">${rp(it.unitPrice)}</td><td class="mono" style="font-size:10px;font-weight:600">${rp(it.totalPrice)}</td></tr>`});
      mh+=`<tr style="background:rgba(52,211,153,.05)"><td colspan="4"></td><td style="font-weight:700;font-size:10px">Subtotal</td><td class="mono" style="font-weight:700;font-size:10px">${rp(inv.totalBiaya)}</td></tr>`;
      mh+=`<tr><td colspan="4"></td><td style="font-weight:700;font-size:10px">Ongkir</td><td class="mono" style="font-weight:700;font-size:10px">${rp(inv.ongkir)}</td></tr>`;
      mh+=`<tr style="background:rgba(52,211,153,.08)"><td colspan="4"></td><td style="font-weight:800;font-size:11px;color:var(--green)">Grand Total</td><td class="mono" style="font-weight:800;font-size:12px;color:var(--green)">${rp(inv.grandTotal)}</td></tr>`;
      mh+=`</tbody></table></div>`;

      // Edit section
      mh+=`<div class="cd" style="background:var(--bg2)"><div class="cd-t">Edit Invoice</div><div class="grid-2" style="margin-bottom:10px">`;
      mh+=`<div class="field"><label>Status ${role==="ut_rantau"?"(Penerimaan)":"(Pengiriman)"}</label><select id="md-st">${STATUS_LIST.map(s=>`<option ${editSt===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
      mh+=`<div class="field"><label>Jenis Pengiriman ${role!=="ut_rantau"?"🔒":""}</label><select id="md-tipe" ${role!=="ut_rantau"?"disabled":""}><option ${editTipe==="Reguler"?"selected":""}>Reguler</option><option ${editTipe==="Borongan"?"selected":""}>Borongan</option></select></div>`;
      mh+=`<div class="field"><label>Armada ${role!=="ut_rantau"?"🔒":""}</label><select id="md-arm" ${role!=="ut_rantau"?"disabled":""}>${ARMADA.map(a=>`<option value="${a.id}" ${editArm===a.id?'selected':''}>${a.name} (${a.weight}T)</option>`).join('')}</select></div>`;
      mh+=`<div class="field"><label>Catatan ${role==="vendor"?"🔒":""}</label><input id="md-note" value="${editNote}" ${role==="vendor"?"disabled":""} placeholder="Catatan..."></div>`;
      mh+=`</div><div style="display:flex;justify-content:flex-end"><button class="btn btn-p btn-sm" onclick="saveInvChanges('${inv.id}')">💾 Simpan Perubahan</button></div></div>`;

      // Audit trail
      mh+=`<div class="audit"><span>🕐</span><span>Terakhir diubah oleh <strong style="color:var(--t1)">${inv.lastModBy}</strong> pada ${inv.lastModAt}</span></div>`;
      mh+=`<div style="margin-top:14px;text-align:right"><button class="btn btn-g" onclick="closeModal()">Tutup</button></div>`;
      return mh;
    }

    showModal(buildModal());
  };

  window.saveInvChanges=function(id){
    const idx=invoices.findIndex(i=>i.id===id);if(idx===-1)return;
    const st=document.getElementById('md-st').value;
    const tipe=document.getElementById('md-tipe').value;
    const armId=document.getElementById('md-arm').value;
    const note=document.getElementById('md-note').value;
    const arm=ARMADA.find(a=>a.id===armId);
    invoices[idx]={...invoices[idx],status:st,tipe,armadaId:armId,armada:arm?.name||invoices[idx].armada,catatan:note,lastModBy:`${currentUser.label} - ${currentUser.name}`,lastModAt:now(),ongkir:tipe==="Reguler"?(arm?.biayaReg||invoices[idx].ongkir):(arm?.biayaBor||invoices[idx].ongkir),grandTotal:invoices[idx].totalBiaya+(tipe==="Reguler"?(arm?.biayaReg||0):(arm?.biayaBor||0))};
    closeModal();
    build();
  };

  build();
}

// MODAL HELPERS
// ============================================================
function showModal(html){
  let mo=document.getElementById('global-modal');
  if(!mo){mo=document.createElement('div');mo.id='global-modal';mo.className='mo';document.body.appendChild(mo);}
  mo.innerHTML=`<div class="ml" onclick="event.stopPropagation()">${html}</div>`;
  mo.style.display='flex';
  mo.onclick=closeModal;
}
function closeModal(){
  const mo=document.getElementById('global-modal');
  if(mo)mo.style.display='none';
}

function renderSubmitInvoice(c){
  const role=currentUser.role;
  let itemRows=[{pn:"",nama:"",qty:1,unitPrice:""}];

  function build(){
    const subtotal=itemRows.reduce((s,r)=>s+(+r.qty||0)*(+r.unitPrice||0),0);
    let html=`<div class="pg-hd fi"><div><h2>📝 Submit Invoice Baru</h2><p>Input data invoice pengiriman ke Site Rantau</p></div></div>`;
    html+=`<div id="submit-success" class="success-msg hidden">✓ Invoice berhasil disubmit!</div>`;

    // Info pengiriman
    html+=`<div class="cd fi"><div class="cd-t">Informasi Pengiriman</div><div class="grid-5" style="margin-bottom:16px">`;
    html+=`<div class="field"><label>No. Invoice Vendor</label><input id="si-invno" placeholder="e.g. 09579/EXA/II/2026"></div>`;
    html+=`<div class="field"><label>Hub Asal</label><select id="si-hub">${HUBS.map(h=>`<option>${h}</option>`).join('')}</select></div>`;
    html+=`<div class="field"><label>Tipe Pengiriman</label><select id="si-tipe"><option>Reguler</option><option>Borongan</option></select></div>`;
    html+=`<div class="field"><label>Armada</label><select id="si-arm">${ARMADA.map(a=>`<option value="${a.id}">${a.name} (${a.weight}T)</option>`).join('')}</select></div>`;
    if(role==="vendor"){
      html+=`<div class="field"><label>Vendor</label><input value="${currentUser.name}" disabled></div>`;
    }else{
      html+=`<div class="field"><label>Vendor</label><select id="si-vendor">${VENDORS_LIST.map(v=>`<option>${v}</option>`).join('')}</select></div>`;
    }
    html+=`</div></div>`;

    // Items
    html+=`<div class="cd fi"><div class="cd-t">Detail Item Pengiriman</div><div class="xg"><table><thead><tr><th style="width:28px">#</th><th>AWB / Part Number</th><th>Deskripsi Item</th><th style="width:60px">Qty</th><th style="width:130px">Harga Satuan (Rp)</th><th style="width:130px">Total</th><th style="width:32px">×</th></tr></thead><tbody>`;
    itemRows.forEach((r,i)=>{
      const tot=(+r.qty||0)*(+r.unitPrice||0);
      html+=`<tr><td class="rn">${i+1}</td><td><input value="${r.pn}" onchange="siUpItem(${i},'pn',this.value)" placeholder="AWB/PN..."></td><td><input value="${r.nama}" onchange="siUpItem(${i},'nama',this.value)" placeholder="e.g. Borongan Fuso 7 Way"></td><td><input type="number" value="${r.qty}" onchange="siUpItem(${i},'qty',this.value)" min="1" style="text-align:right;font-family:'IBM Plex Mono'"></td><td><input type="number" value="${r.unitPrice}" onchange="siUpItem(${i},'unitPrice',this.value)" placeholder="0" style="text-align:right;font-family:'IBM Plex Mono'"></td><td class="mono" style="text-align:right;padding:6px 8px;font-size:11px;color:var(--green)">${rp(tot)}</td><td style="text-align:center">${itemRows.length>1?`<button class="btn btn-d btn-sm" onclick="siDelItem(${i})">✕</button>`:''}</td></tr>`;
    });
    html+=`</tbody></table></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><button class="btn btn-g btn-sm" onclick="siAddItem()">＋ Tambah Item</button><div class="mono" style="font-size:13px;color:var(--green);font-weight:700">Subtotal: ${rp(subtotal)}</div></div></div>`;

    // Catatan
    html+=`<div class="cd fi"><div class="field"><label>Catatan</label><textarea id="si-catatan" placeholder="Catatan tambahan (opsional)..."></textarea></div></div>`;
    html+=`<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-p" onclick="siSubmit()" style="padding:10px 24px;font-size:13px">📤 Submit Invoice</button></div>`;

    c.innerHTML=html;
  }

  window.siUpItem=function(i,k,v){itemRows[i][k]=v;build()};
  window.siAddItem=function(){itemRows.push({pn:"",nama:"",qty:1,unitPrice:""});build()};
  window.siDelItem=function(i){if(itemRows.length>1){itemRows.splice(i,1);build()}};

  window.siSubmit=function(){
    const items=itemRows.filter(r=>r.nama).map(r=>({pn:r.pn||"—",nama:r.nama,qty:+r.qty||1,unitPrice:+r.unitPrice||0,totalPrice:(+r.qty||1)*(+r.unitPrice||0)}));
    if(!items.length)return;
    const hub=document.getElementById('si-hub').value;
    const tipe=document.getElementById('si-tipe').value;
    const armId=document.getElementById('si-arm').value;
    const vendor=role==="vendor"?currentUser.name:(document.getElementById('si-vendor')?.value||VENDORS_LIST[0]);
    const catatan=document.getElementById('si-catatan').value;
    const invNo=document.getElementById('si-invno').value;
    const arm=ARMADA.find(a=>a.id===armId);
    const tb=items.reduce((s,it)=>s+it.totalPrice,0);
    const ok=tipe==="Reguler"?arm.biayaReg:arm.biayaBor;
    const inv={id:genId(),tanggal:new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"}),hub,tipe,armada:arm.name,armadaId:arm.id,vendor,items,totalBiaya:tb,ongkir:ok,grandTotal:tb+ok,volume:0,berat:0,status:"Draft",lastModBy:`${currentUser.label} - ${currentUser.name}`,lastModAt:now(),catatan,vendorInvoiceNo:invNo};
    invoices.unshift(inv);
    const msg=document.getElementById('submit-success');if(msg){msg.classList.remove('hidden');setTimeout(()=>msg.classList.add('hidden'),2000)}
    itemRows=[{pn:"",nama:"",qty:1,unitPrice:""}];
    setTimeout(()=>build(),100);
  };

  build();
}

// 4. SMART FLEET ADVISOR

function renderAdvisor(c){
  let rows=[{mode:"db",pn:"",nama:"",brand:"",panjang:0,lebar:0,tinggi:0,berat:0,qty:1,urgency:"normal"}];
  let result=null;

  function build(){
    let html=`<div class="pg-hd fi"><div><h2>🔧 Smart Fleet Advisor</h2><p>Input sparepart → rekomendasi armada & mode pengiriman</p></div><div class="export-wrap"><button class="btn btn-grn btn-sm" onclick="this.nextElementSibling.classList.toggle('show')">⬇ Export</button><div class="export-dd"><div onclick="advExport('CSV')">CSV</div><div onclick="advExport('JSON')">Excel (JSON)</div><div onclick="window.print()">PDF (Print)</div></div></div></div>`;

    html+=`<div class="cd fi"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="cd-t" style="margin-bottom:0">Input Sparepart</div><button class="btn btn-g btn-sm" onclick="advAddRow()">＋ Tambah Baris</button></div>`;

    rows.forEach((r,i)=>{
      const urgCol=URGENCY.find(u=>u.id===r.urgency)?.color||'var(--t1)';
      html+=`<div style="background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:12px;margin-bottom:8px">`;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;font-weight:800;color:var(--t3);width:20px">#${i+1}</span><div style="display:flex;gap:4px"><button class="btn btn-sm ${r.mode==='db'?'btn-p':'btn-g'}" onclick="advToggle(${i},'db')">📋 Dari Database</button><button class="btn btn-sm ${r.mode==='manual'?'btn-p':'btn-g'}" onclick="advToggle(${i},'manual')">✏️ Input Manual</button></div></div><div style="display:flex;align-items:center;gap:8px"><select onchange="advUp(${i},'urgency',this.value)" style="background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);padding:4px 8px;color:${urgCol};font-family:inherit;font-size:11px;font-weight:700">${URGENCY.map(u=>`<option value="${u.id}" ${r.urgency===u.id?'selected':''}style="color:${u.color}">${u.label}</option>`).join('')}</select>${rows.length>1?`<button class="btn btn-d btn-sm" onclick="advDel(${i})">✕</button>`:''}</div></div>`;

      if(r.mode==='db'){
        html+=`<div style="display:flex;gap:10px;align-items:end"><div class="field" style="flex:1"><label>Pilih Part dari Database</label><select onchange="advSelDB(${i},this.value)" style="background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);padding:8px 10px;color:var(--t1);font-family:inherit;font-size:12px;width:100%"><option value="">— Pilih Part Number —</option>${PARTS_DB.map(p=>`<option value="${p.pn}" ${r.pn===p.pn?'selected':''}>${p.pn} — ${p.nama} (${p.brand})</option>`).join('')}</select></div><div class="field" style="width:70px"><label>Qty</label><input type="number" value="${r.qty}" min="1" onchange="advUp(${i},'qty',+this.value||1)" style="background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);padding:8px 10px;color:var(--t1);font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;width:100%"></div></div>`;
        if(r.pn){
          html+=`<div style="display:flex;gap:16px;margin-top:8px;padding:8px 10px;background:rgba(34,211,238,.05);border:1px solid rgba(34,211,238,.12);border-radius:var(--rs)"><span style="font-size:11px;font-weight:700;color:var(--cyan)">${r.nama}</span><span class="mono" style="font-size:10px;color:var(--t2)">P:${r.panjang}cm</span><span class="mono" style="font-size:10px;color:var(--t2)">L:${r.lebar}cm</span><span class="mono" style="font-size:10px;color:var(--t2)">T:${r.tinggi}cm</span><span class="mono" style="font-size:10px;color:var(--amber);font-weight:600">Berat:${r.berat}kg</span><span class="mono" style="font-size:10px;color:var(--t3)">×${r.qty}</span></div>`;
        }
      }else{
        html+=`<div style="display:grid;grid-template-columns:1fr 1fr 65px 65px 65px 80px 60px;gap:8px">`;
        html+=`<div class="field"><label>Part Number</label><input value="${r.pn}" onchange="advUp(${i},'pn',this.value)" placeholder="Opsional"></div>`;
        html+=`<div class="field"><label>Nama Part</label><input value="${r.nama}" onchange="advUp(${i},'nama',this.value)" placeholder="Nama sparepart"></div>`;
        ['panjang','lebar','tinggi'].forEach(k=>{html+=`<div class="field"><label>${k==='panjang'?'P':k==='lebar'?'L':'T'} (cm)</label><input type="number" value="${r[k]||''}" onchange="advUp(${i},'${k}',+this.value||0)" placeholder="0" style="font-family:'IBM Plex Mono';text-align:right"></div>`});
        html+=`<div class="field"><label>Berat (kg)</label><input type="number" value="${r.berat||''}" onchange="advUp(${i},'berat',+this.value||0)" placeholder="0" style="font-family:'IBM Plex Mono';text-align:right"></div>`;
        html+=`<div class="field"><label>Qty</label><input type="number" value="${r.qty}" min="1" onchange="advUp(${i},'qty',+this.value||1)" style="font-family:'IBM Plex Mono';text-align:center"></div>`;
        html+=`</div>`;
      }
      html+=`</div>`;
    });

    html+=`<div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="btn btn-p" onclick="advAnalyze()" style="padding:10px 20px">🔍 Analisa & Rekomendasikan</button></div></div>`;

    // Results
    if(result){
      html+=`<div class="fi">`;
      // Stats
      const stats=[
        {l:"Total Volume",v:`${result.tV.toFixed(4)} m³`,c:"var(--cyan)"},
        {l:"Total Berat",v:`${(result.tW*1000).toFixed(1)} kg (${result.tW.toFixed(3)} Ton)`,c:"var(--amber)"},
        {l:"Dimensi Max",v:`${result.maxDim.p}×${result.maxDim.l}×${result.maxDim.t} cm`,c:"var(--purple)"},
        {l:"Urgensi Tertinggi",v:URGENCY.find(u=>u.id===result.hU)?.label,c:URGENCY.find(u=>u.id===result.hU)?.color}
      ];
      html+=`<div class="stats">${stats.map(s=>`<div class="st" style="border-top:3px solid ${s.c}"><div class="st-l">${s.l}</div><div class="mono" style="font-size:13px;font-weight:700;margin-top:4px;color:${s.c}">${s.v}</div></div>`).join('')}</div>`;

      // Mode recommendation
      const mc={reguler:"var(--green)",reguler_priority:"var(--amber)",borongan:"var(--red)"};
      const ml={reguler:"Reguler (Jadwal Harian)",reguler_priority:"Reguler Prioritas",borongan:"Borongan (Khusus)"};
      const md={reguler:"Semua item muat di CDD reguler.",reguler_priority:"Item urgent masuk jadwal reguler terdekat.",borongan:result.hU==="critical"?"Unit VOR — kirim hari ini!":"Dimensi/berat melebihi kapasitas reguler."};
      const mIco={reguler:"📦",reguler_priority:"⚡",borongan:"🚛"};
      html+=`<div style="background:${mc[result.mode]}11;border:1px solid ${mc[result.mode]}44;border-radius:var(--r);padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:8px;background:${mc[result.mode]}22;display:flex;align-items:center;justify-content:center;font-size:16px">${mIco[result.mode]}</div><div><div style="font-size:12px;font-weight:800;color:${mc[result.mode]}">Rekomendasi: ${ml[result.mode]}</div><div style="font-size:10px;color:var(--t2);margin-top:2px">${md[result.mode]}</div></div></div>`;

      // Best fit
      if(result.best){
        const b=result.best;
        const cost=result.mode==="borongan"?b.biayaBor:b.biayaReg;
        html+=`<div class="cd" style="border-color:var(--green);border-width:2px"><div style="display:flex;justify-content:space-between"><div><div class="badge" style="background:rgba(52,211,153,.12);color:var(--green);margin-bottom:6px">✓ Armada Terbaik</div><div style="font-size:16px;font-weight:800;color:${b.color}">${b.name}</div><div style="font-size:10px;color:var(--t3)">Kapasitas: ${b.volume.toLocaleString()} m³ / ${b.weight} Ton</div></div><div style="text-align:right"><div style="font-size:8px;color:var(--t3)">ESTIMASI BIAYA (${result.mode==="reguler"?"REGULER":"BORONGAN"})</div><div class="mono" style="font-size:14px;font-weight:700;color:var(--green)">${rp(cost)}</div></div></div>`;
        html+=`<div class="grid-2" style="margin-top:10px">${[["Volume",b.vp],["Berat",b.wp]].map(([l,v])=>`<div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t2)"><span>${l}</span><span class="mono">${v.toFixed(1)}%</span></div><div class="cpb" style="height:6px"><div class="cpf" style="width:${Math.min(v,100)}%;background:${v>80?'var(--amber)':'var(--green)'}"></div></div></div>`).join('')}</div></div>`;
      }

      // Split
      if(result.split){
        const sp=result.split;
        html+=`<div class="split-bx"><div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span>✂️</span><span style="font-size:12px;font-weight:800;color:var(--blue)">Opsi Split Pengiriman</span></div><div style="font-size:10px;color:var(--t2);margin-bottom:10px">Split berdasarkan urgensi — urgent kirim borongan, sisanya reguler:</div>`;
        html+=`<div class="tl"><div class="tl-i"><div class="tl-d" style="border-color:var(--red)"></div><div style="background:var(--bg2);border-radius:var(--rs);padding:8px;border:1px solid var(--b1)"><div style="display:flex;justify-content:space-between"><div><div style="font-size:10px;font-weight:700">Batch 1 — Urgent (Borongan)</div><div style="font-size:9px;color:var(--t3)">${sp.uI.length} item • ${(sp.uW*1000).toFixed(1)} kg</div></div><div style="text-align:right"><div style="font-size:11px;font-weight:700;color:${sp.uf.color}">${sp.uf.name}</div><div class="mono" style="font-size:9px;color:var(--t3)">${rp(sp.uf.biayaBor)}</div></div></div></div></div>`;
        html+=`<div class="tl-i"><div class="tl-d" style="border-color:var(--green)"></div><div style="background:var(--bg2);border-radius:var(--rs);padding:8px;border:1px solid var(--b1)"><div style="display:flex;justify-content:space-between"><div><div style="font-size:10px;font-weight:700">Batch 2 — Normal (Reguler)</div><div style="font-size:9px;color:var(--t3)">${sp.nI.length} item • ${(sp.nW*1000).toFixed(1)} kg</div></div><div style="text-align:right"><div style="font-size:11px;font-weight:700;color:${sp.nf.color}">${sp.nf.name}</div><div class="mono" style="font-size:9px;color:var(--t3)">${rp(sp.nf.biayaReg)}</div></div></div></div></div></div>`;
        html+=`<div style="margin-top:8px;padding:8px;background:var(--bg1);border-radius:var(--rs);display:flex;justify-content:space-between;font-size:10px"><span style="color:var(--t2)">Total biaya split:</span><span class="mono" style="font-weight:700;color:${sp.sc<sp.cc?'var(--green)':'var(--amber)'}">${rp(sp.sc)} ${sp.sc<sp.cc?'💰 Lebih hemat!':''}</span></div></div>`;
      }

      // All armada comparison
      html+=`<div class="cd" style="margin-top:12px"><div class="cd-t">Perbandingan Semua Armada</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px">`;
      result.allIn.forEach(a=>{
        html+=`<div style="background:var(--bg1);border:1px solid ${a.fits?'var(--green)':'var(--b1)'};border-radius:var(--rs);padding:8px;text-align:center;opacity:${a.fits?1:.3}"><div style="font-size:11px;font-weight:700;color:${a.color}">${a.name}</div><div class="mono" style="font-size:8px;color:var(--t3)">${a.weight} Ton / ${(a.volume/1000).toFixed(0)}k m³</div><div style="margin-top:4px;font-size:8px;color:var(--t2)">Vol: <span class="mono">${Math.min(a.vp,999).toFixed(0)}%</span></div><div class="cpb"><div class="cpf" style="width:${Math.min(a.vp,100)}%;background:${a.vp>100?'var(--red)':'var(--green)'}"></div></div><div style="margin-top:2px;font-size:8px;color:var(--t2)">Brt: <span class="mono">${Math.min(a.wp,999).toFixed(0)}%</span></div><div class="cpb"><div class="cpf" style="width:${Math.min(a.wp,100)}%;background:${a.wp>100?'var(--red)':'var(--cyan)'}"></div></div><div style="margin-top:4px">${a.fits?'<span class="badge" style="background:rgba(52,211,153,.12);color:var(--green)">✓ Muat</span>':`<span class="badge" style="background:rgba(248,113,113,.1);color:var(--red)">✗ ${!a.df?"Dimensi":a.vp>100?"Volume":"Berat"}</span>`}</div></div>`;
      });
      html+=`</div></div></div>`;
    }

    c.innerHTML=html;
  }

  window.advUp=function(i,k,v){rows[i][k]=v;if(k==='urgency')build()};
  window.advToggle=function(i,mode){rows[i]={...rows[i],mode,pn:"",nama:"",panjang:0,lebar:0,tinggi:0,berat:0};build()};
  window.advSelDB=function(i,pn){const p=PARTS_DB.find(x=>x.pn===pn);if(p){rows[i]={...rows[i],pn:p.pn,nama:p.nama,brand:p.brand,panjang:p.panjang,lebar:p.lebar,tinggi:p.tinggi,berat:p.berat}};build()};
  window.advAddRow=function(){rows.push({mode:"db",pn:"",nama:"",brand:"",panjang:0,lebar:0,tinggi:0,berat:0,qty:1,urgency:"normal"});build()};
  window.advDel=function(i){if(rows.length>1){rows.splice(i,1);build()}};
  window.advAnalyze=function(){const items=rows.filter(r=>r.nama||r.panjang>0).map(r=>({...r,panjang:+r.panjang||0,lebar:+r.lebar||0,tinggi:+r.tinggi||0,berat:+r.berat||0,qty:+r.qty||1}));if(items.length)result=analyzeShipment(items);build()};
  window.advExport=function(fmt){
    if(!result)return;
    const h=["PN","Nama","P(cm)","L(cm)","T(cm)","Berat(kg)","Qty","Urgensi"];
    const r2=rows.filter(r=>r.nama).map(r=>[r.pn,r.nama,r.panjang,r.lebar,r.tinggi,r.berat,r.qty,r.urgency]);
    if(fmt==="CSV")exportCSV(h,r2,"fleet_advisor");else if(fmt==="JSON")exportJSON({items:rows.filter(r=>r.nama),result:{mode:result?.mode,best:result?.best?.name}},  "fleet_advisor");else window.print();
    document.querySelectorAll('.export-dd.show').forEach(d=>d.classList.remove('show'));
  };

  build();
}

// ============================================================
// 5. SCHEDULE
// ============================================================
function renderSchedule(c){
  const role=currentUser.role;
  const canEdit=(role==="hub"||role==="ut_rantau");
  const canEditStatus=(role==="hub"||role==="ut_rantau");

  function getDim(){return new Date(schedYear,schedMonth+1,0).getDate()}
  function getFd(){return new Date(schedYear,schedMonth,1).getDay()}
  function getDays(){return Array.from({length:getDim()},(_,i)=>i+1)}

  function getCov(){
    const cm=new Map();
    Object.entries(fusoMap).forEach(([ds,{dir}])=>{
      const d=+ds;let covDay;
      if(dir==="before")covDay=d-1;else if(dir==="after")covDay=d+1;else covDay=+dir;
      if(covDay>=1&&covDay<=getDim())cm.set(covDay,d);
    });
    return cm;
  }

  function getCovLabel(d){const fm=fusoMap[d];if(!fm)return"";if(fm.dir==="before")return d-1;if(fm.dir==="after")return d+1;return+fm.dir}

  function getReg(d){
    const cov=getCov();
    if(fusoMap[d])return{type:"fuso",label:"Fuso On-Call",color:"#F59E0B",bg:"rgba(251,191,36,.1)",covDay:getCovLabel(d)};
    if(cov.has(d))return{type:"rest",label:`Covered ←tgl ${cov.get(d)}`,color:"#F87171",bg:"rgba(248,113,113,.12)"};
    return d%2===1?{type:"cdd_box",label:"CDD Box",color:"#4B8DF8",bg:"rgba(75,141,248,.1)"}:{type:"cdd_3way",label:"CDD 3 Way",color:"#22D3EE",bg:"rgba(34,211,238,.1)"};
  }

  const schStColor=s=>({"Dijadwalkan":"var(--blue)","Menunggu Armada":"var(--purple)","Armada Standby":"var(--purple)","Dalam Perjalanan":"var(--amber)","Selesai":"var(--green)"}[s]||"var(--t3)");
  const schStBg=s=>({"Dijadwalkan":"rgba(75,141,248,.12)","Menunggu Armada":"rgba(167,139,250,.12)","Armada Standby":"rgba(167,139,250,.12)","Dalam Perjalanan":"rgba(251,191,36,.12)","Selesai":"rgba(52,211,153,.12)"}[s]||"rgba(94,116,153,.12)");

  function build(){
    const days=getDays();const dim=getDim();const fd=getFd();
    const fusoEntries=Object.entries(fusoMap).sort((a,b)=>+a[0]-+b[0]);
    const totalFuso=fusoEntries.length;
    const fusoSelesai=fusoEntries.filter(([,v])=>v.status==="Selesai").length;
    const borTotal=borSch.length;
    const borSelesai=borSch.filter(b=>b.status==="Selesai").length;

    let html=`<div class="pg-hd fi"><div><h2>📅 Penjadwalan Armada</h2><p>Reguler + Borongan + Fuso On-Call</p></div><div class="export-wrap"><button class="btn btn-grn btn-sm" onclick="this.nextElementSibling.classList.toggle('show')">⬇ Export</button><div class="export-dd"><div onclick="schExport('CSV')">CSV</div><div onclick="schExport('JSON')">Excel (JSON)</div><div onclick="window.print()">PDF (Print)</div></div></div></div>`;

    // Stats
    const sts=[{l:"CDD Box",v:days.filter(d=>getReg(d).type==="cdd_box").length,c:"var(--blue)"},{l:"CDD 3 Way",v:days.filter(d=>getReg(d).type==="cdd_3way").length,c:"var(--cyan)"},{l:"Fuso OC",v:`${fusoSelesai}/${totalFuso}`,s:"selesai",c:"var(--amber)"},{l:"Borongan",v:`${borSelesai}/${borTotal}`,s:"selesai",c:"var(--red)"}];
    html+=`<div class="stats">${sts.map(s=>`<div class="st fi" style="border-top:3px solid ${s.c}"><div class="st-l">${s.l}</div><div class="st-v" style="font-size:20px">${s.v}</div>${s.s?`<div class="st-s">${s.s}</div>`:''}</div>`).join('')}</div>`;

    // Month selector + controls
    html+=`<div class="cd fi" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div style="display:flex;align-items:center;gap:8px"><select id="sch-month" style="background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:6px 8px;color:var(--t1);font-family:inherit;font-size:11px">${MONTHS.map((m,i)=>`<option value="${i}" ${schedMonth===i?'selected':''}>${m}</option>`).join('')}</select><span class="mono" style="color:var(--t3);font-size:12px">${schedYear}</span></div>`;
    html+=`<div style="display:flex;align-items:center;gap:12px">`;
    if(canEdit)html+=`<button class="btn btn-p btn-sm" onclick="schShowAddBor()">＋ Borongan</button>`;
    if(canEdit)html+=`<div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:700;color:${fusoOn?'var(--amber)':'var(--t3)'}">Fuso OC</span><div class="tog ${fusoOn?'on':''}" onclick="schToggleFuso()" style="${fusoOn?'background:var(--amber)':''}"></div></div>`;
    html+=`</div></div>`;

    if(fusoOn&&canEdit)html+=`<div style="background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:var(--r);padding:10px;margin-bottom:12px;font-size:11px;display:flex;gap:8px">⚡ <span style="color:var(--amber);font-weight:700">Fuso On-Call aktif.</span> <span style="color:var(--t2)">Klik tanggal → pilih cover sebelum, sesudah, atau tanggal custom.</span></div>`;

    // Calendar
    html+=`<div class="cd fi"><div class="sg" style="margin-bottom:4px">${["Min","Sen","Sel","Rab","Kam","Jum","Sab"].map(d=>`<div style="text-align:center;font-size:9px;font-weight:700;color:var(--t3);padding:4px">${d}</div>`).join('')}</div><div class="sg">`;
    for(let i=0;i<fd;i++)html+=`<div></div>`;
    days.forEach(d=>{
      const reg=getReg(d);
      const isToday=(d===22&&schedMonth===2);
      const bors=borSch.filter(b=>b.day===d);
      html+=`<div class="sd ${isToday?'today':''}" ${fusoOn&&canEdit?`onclick="schFusoClick(${d})"`:''}>`;
      html+=`<div class="sd-n">${d}</div>`;
      html+=`<div class="sd-v" style="background:${reg.bg};color:${reg.color}">${reg.label}${reg.covDay?`<span style="font-size:7px;opacity:.7;display:block">cover tgl ${reg.covDay}</span>`:''}</div>`;
      bors.forEach(b=>{const arm=ARMADA.find(a=>a.id===b.armadaId);html+=`<div class="sd-v" style="background:${arm?.color}18;color:${arm?.color};margin-top:2px;border:1px solid ${arm?.color}33">🚛 ${arm?.name}</div>`});
      html+=`</div>`;
    });
    html+=`</div>`;
    html+=`<div style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap">${[["CDD Box","#4B8DF8"],["CDD 3 Way","#22D3EE"],["Fuso OC","#F59E0B"],["Borongan","#EF4444"],["Covered","#F87171"]].map(([l,cl])=>`<div class="leg"><div class="leg-d" style="background:${cl}"></div>${l}</div>`).join('')}</div></div>`;

    // Fuso Summary
    if(fusoEntries.length>0){
      html+=`<div class="cd fi"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="cd-t" style="margin-bottom:0">📊 Summary Fuso On-Call (${fusoSelesai}/${totalFuso} Selesai)</div>${totalFuso>0?`<div style="width:120px;display:flex;align-items:center;gap:6px"><div class="cpb" style="flex:1;height:6px"><div class="cpf" style="width:${(fusoSelesai/totalFuso)*100}%;background:var(--green)"></div></div><span class="mono" style="font-size:10px;color:var(--green)">${Math.round((fusoSelesai/totalFuso)*100)}%</span></div>`:''}</div>`;
      html+=`<table class="dtb"><thead><tr><th>Fuso Tgl</th><th>Cover Jatah Tgl</th><th>Arah</th><th>Status</th><th>Terakhir Diubah</th>${canEditStatus?'<th>Update</th>':''}</tr></thead><tbody>`;
      fusoEntries.forEach(([dayStr,val])=>{
        const d=+dayStr;const covD=getCovLabel(d);const st=val.status||"Dijadwalkan";
        const dirLabel=val.dir==="before"?"← Sebelum":val.dir==="after"?"Sesudah →":"📅 Custom";
        const dirBg=val.dir==="before"?"rgba(167,139,250,.1)":val.dir==="after"?"rgba(34,211,238,.1)":"rgba(52,211,153,.1)";
        const dirC=val.dir==="before"?"var(--purple)":val.dir==="after"?"var(--cyan)":"var(--green)";
        html+=`<tr><td style="font-weight:700;color:var(--amber)">${d} ${MONTHS[schedMonth]}</td><td><span style="color:var(--red);font-weight:600">${covD} ${MONTHS[schedMonth]}</span> <span class="badge" style="background:rgba(248,113,113,.1);color:var(--red);margin-left:4px">CDD diganti</span></td><td><span class="badge" style="background:${dirBg};color:${dirC}">${dirLabel}</span></td><td><span class="badge" style="background:${schStBg(st)};color:${schStColor(st)}">${st}</span></td><td style="font-size:9px;color:var(--t3)">${val.lastModBy?`${val.lastModBy} • ${val.lastModAt}`:'—'}</td>${canEditStatus?`<td><select onchange="schUpdateFusoSt(${d},this.value)" style="background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:4px 6px;color:${schStColor(st)};font-family:inherit;font-size:10px;width:100%">${FUSO_STATUS.map(s=>`<option value="${s}" ${st===s?'selected':''}>${s}</option>`).join('')}</select></td>`:''}</tr>`;
      });
      html+=`</tbody></table>`;
      if(canEdit){html+=`<div style="margin-top:8px;display:flex;gap:6px">${fusoEntries.map(([dayStr])=>`<button class="btn btn-d btn-sm" onclick="schDelFuso(${+dayStr})">✕ Hapus Fuso tgl ${+dayStr}</button>`).join('')}</div>`}
      html+=`</div>`;
    }

    // Borongan Summary
    if(borSch.length>0){
      html+=`<div class="cd fi"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="cd-t" style="margin-bottom:0">📊 Summary Borongan (${borSelesai}/${borTotal} Selesai)</div>${borTotal>0?`<div style="width:120px;display:flex;align-items:center;gap:6px"><div class="cpb" style="flex:1;height:6px"><div class="cpf" style="width:${(borSelesai/borTotal)*100}%;background:var(--green)"></div></div><span class="mono" style="font-size:10px;color:var(--green)">${Math.round((borSelesai/borTotal)*100)}%</span></div>`:''}</div>`;
      html+=`<table class="dtb"><thead><tr><th>Tgl</th><th>Armada</th><th>Catatan</th><th>Status</th><th>Terakhir Diubah</th>${canEditStatus?'<th>Update</th>':''}${canEdit?'<th>×</th>':''}</tr></thead><tbody>`;
      borSch.forEach((b,i)=>{
        const arm=ARMADA.find(a=>a.id===b.armadaId);const st=b.status||"Dijadwalkan";
        html+=`<tr><td style="font-weight:600">${b.day} ${MONTHS[schedMonth]}</td><td style="color:${arm?.color};font-weight:700">${arm?.name} <span style="font-size:9px;color:var(--t3);font-weight:400">(${arm?.weight}T)</span></td><td style="font-size:10px">${b.catatan||"—"}</td><td><span class="badge" style="background:${schStBg(st)};color:${schStColor(st)}">${st}</span></td><td style="font-size:9px;color:var(--t3)">${b.lastModBy?`${b.lastModBy} • ${b.lastModAt}`:'—'}</td>${canEditStatus?`<td><select onchange="schUpdateBorSt(${i},this.value)" style="background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:4px 6px;color:${schStColor(st)};font-family:inherit;font-size:10px;width:100%">${BOR_STATUS.map(s=>`<option value="${s}" ${st===s?'selected':''}>${s}</option>`).join('')}</select></td>`:''} ${canEdit?`<td><button class="btn btn-d btn-sm" onclick="schDelBor(${i})">✕</button></td>`:''}</tr>`;
      });
      html+=`</tbody></table></div>`;
    }

    c.innerHTML=html;
    document.getElementById('sch-month').onchange=e=>{schedMonth=+e.target.value;fusoMap={};borSch=[];build()};
  }

  window.schToggleFuso=function(){fusoOn=!fusoOn;build()};

  window.schFusoClick=function(d){
    if(fusoMap[d]){
      // Cancel fuso
      showModal(`<h3>Batalkan Fuso Tgl ${d}</h3><p style="color:var(--t2);font-size:12px;margin-bottom:14px">Cover jatah tgl ${getCovLabel(d)}. Batalkan?</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Batal</button><button class="btn btn-d" onclick="delete fusoMap[${d}];closeModal();renderSchedule(document.getElementById('page-container'))">Batalkan</button></div>`);
    }else{
      // Fuso picker
      const dim=getDim();
      let mh=`<h3>Fuso On-Call — Tgl ${d} ${MONTHS[schedMonth]}</h3><p style="color:var(--t2);font-size:12px;margin-bottom:16px">Fuso dikirim tanggal <strong style="color:var(--t1)">${d}</strong>. Pilih jatah CDD mana yang di-cover:</p>`;
      mh+=`<div class="grid-3" style="margin-bottom:16px">`;
      mh+=`<div onclick="${d>1?`schSetFuso(${d},'before')`:''}" style="background:${d>1?'var(--bg2)':'var(--bg3)'};border:1px solid var(--b2);border-radius:var(--r);padding:16px;cursor:${d>1?'pointer':'not-allowed'};opacity:${d>1?1:.35};text-align:center"><div style="font-size:24px;margin-bottom:8px">⬅️</div><div style="font-size:12px;font-weight:800;color:var(--amber)">Hari Sebelum</div><div style="font-size:11px;color:var(--t2);margin-top:6px">Tgl <strong style="color:var(--t1)">${d-1}</strong></div><div style="font-size:9px;color:var(--t3);margin-top:4px">Cover jatah tgl ${d-1}</div></div>`;
      mh+=`<div onclick="${d<dim?`schSetFuso(${d},'after')`:''}" style="background:${d<dim?'var(--bg2)':'var(--bg3)'};border:1px solid var(--b2);border-radius:var(--r);padding:16px;cursor:${d<dim?'pointer':'not-allowed'};opacity:${d<dim?1:.35};text-align:center"><div style="font-size:24px;margin-bottom:8px">➡️</div><div style="font-size:12px;font-weight:800;color:var(--cyan)">Hari Sesudah</div><div style="font-size:11px;color:var(--t2);margin-top:6px">Tgl <strong style="color:var(--t1)">${d+1}</strong></div><div style="font-size:9px;color:var(--t3);margin-top:4px">Cover jatah tgl ${d+1}</div></div>`;
      mh+=`<div onclick="schShowCustomFuso(${d})" style="background:var(--bg2);border:1px solid var(--b2);border-radius:var(--r);padding:16px;cursor:pointer;text-align:center"><div style="font-size:24px;margin-bottom:8px">📅</div><div style="font-size:12px;font-weight:800;color:var(--green)">Tanggal Lain</div><div style="font-size:11px;color:var(--t2);margin-top:6px">Pilih custom</div><div style="font-size:9px;color:var(--t3);margin-top:4px">Ambil jatah CDD tanggal mana saja</div></div>`;
      mh+=`</div><div style="text-align:right"><button class="btn btn-g" onclick="closeModal()">Batal</button></div>`;
      showModal(mh);
    }
  };

  window.schSetFuso=function(d,dir){
    fusoMap[d]={dir,status:"Dijadwalkan",lastModBy:currentUser?.name||"User",lastModAt:new Date().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
    closeModal();build();
  };

  window.schShowCustomFuso=function(d){
    const dim=getDim();const otherDays=Array.from({length:dim},(_,i)=>i+1).filter(dd=>dd!==d);
    const defDay=d>2?d-2:d+2;
    let mh=`<h3>Fuso Tgl ${d} — Pilih Tanggal Custom</h3><p style="color:var(--t2);font-size:12px;margin-bottom:16px">Fuso dikirim tanggal <strong style="color:var(--t1)">${d}</strong>. Pilih tanggal berapa jatah CDD-nya yang di-cover:</p>`;
    mh+=`<div style="display:flex;gap:10px;align-items:end;margin-bottom:16px"><div class="field" style="flex:1"><label>Cover jatah CDD tanggal</label><select id="fuso-custom-day" style="background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rs);padding:8px 10px;color:var(--t1);font-family:inherit;font-size:13px">${otherDays.map(dd=>`<option value="${dd}" ${dd===defDay?'selected':''}>${dd} ${MONTHS[schedMonth]}</option>`).join('')}</select></div></div>`;
    mh+=`<div style="display:flex;gap:8px;justify-content:space-between"><button class="btn btn-g" onclick="schFusoClick(${d})">← Kembali</button><div style="display:flex;gap:8px"><button class="btn btn-g" onclick="closeModal()">Batal</button><button class="btn btn-p" onclick="schSetFuso(${d},document.getElementById('fuso-custom-day').value)">✓ Konfirmasi</button></div></div>`;
    showModal(mh);
  };

  window.schUpdateFusoSt=function(d,st){fusoMap[d]={...fusoMap[d],status:st,lastModBy:currentUser?.name||"User",lastModAt:new Date().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};build()};
  window.schDelFuso=function(d){delete fusoMap[d];build()};
  window.schUpdateBorSt=function(i,st){borSch[i]={...borSch[i],status:st,lastModBy:currentUser?.name||"User",lastModAt:new Date().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};build()};
  window.schDelBor=function(i){borSch.splice(i,1);build()};

  window.schShowAddBor=function(){
    const days=getDays();
    let mh=`<h3>Tambah Borongan</h3><div class="grid-2" style="margin-bottom:12px"><div class="field"><label>Tanggal</label><select id="bor-day">${days.map(d=>`<option value="${d}">${d} ${MONTHS[schedMonth]}</option>`).join('')}</select></div><div class="field"><label>Armada</label><select id="bor-arm">${ARMADA.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div></div><div class="field" style="margin-bottom:12px"><label>Catatan</label><input id="bor-note" placeholder="e.g. Swing Bearing PC200"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Batal</button><button class="btn btn-p" onclick="schAddBor()">Tambah</button></div>`;
    showModal(mh);
  };

  window.schAddBor=function(){
    borSch.push({day:+document.getElementById('bor-day').value,armadaId:document.getElementById('bor-arm').value,catatan:document.getElementById('bor-note').value,createdBy:currentUser?.name||"Hub - User",status:"Dijadwalkan",lastModBy:currentUser?.name||"User",lastModAt:new Date().toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})});
    closeModal();build();
  };

  window.schExport=function(fmt){
    const days=getDays();
    const h=["Tgl","Reguler","Borongan","Status"];
    const r=days.map(d=>{const bors=borSch.filter(b=>b.day===d);return[`${d}/${schedMonth+1}/${schedYear}`,getReg(d).label,bors.map(b=>ARMADA.find(a=>a.id===b.armadaId)?.name).join(", ")||"-",bors.map(b=>b.status||"-").join(", ")||"-"]});
    if(fmt==="CSV")exportCSV(h,r,"jadwal");else if(fmt==="JSON")exportJSON({fuso:fusoMap,borongan:borSch,schedule:days.map(d=>({day:d,reg:getReg(d).label}))},"jadwal");else window.print();
    document.querySelectorAll('.export-dd.show').forEach(d=>d.classList.remove('show'));
  };

  build();
}

// ============================================================
// 6. DATABASE PART
// ============================================================
function renderDatabase(c){
  const role=currentUser.role;
  const canEdit=(role==="hub");
  let search="";

  function build(){
    const f=PARTS_DB.filter(p=>!search||p.pn.toLowerCase().includes(search.toLowerCase())||p.nama.toLowerCase().includes(search.toLowerCase()));

    let html=`<div class="pg-hd fi"><div><h2>🗄️ Database Part</h2><p>${canEdit?"Kelola data sparepart":"Mode lihat"}</p></div><div class="export-wrap"><button class="btn btn-grn btn-sm" onclick="this.nextElementSibling.classList.toggle('show')">⬇ Export</button><div class="export-dd"><div onclick="dbExport('CSV')">CSV</div><div onclick="dbExport('JSON')">Excel (JSON)</div><div onclick="window.print()">PDF (Print)</div></div></div></div>`;

    // Add form
    if(canEdit){
      html+=`<div class="cd fi"><div class="cd-t">Tambah Part</div><div class="xg"><table><thead><tr><th>PN</th><th>Nama</th><th>Brand</th><th>Kategori</th><th>P</th><th>L</th><th>T</th><th>Berat</th><th style="width:50px">+</th></tr></thead><tbody><tr>`;
      html+=`<td><input id="db-pn" placeholder="1U-3352"></td><td><input id="db-nama" placeholder="Nama"></td><td><input id="db-brand" placeholder="CAT"></td><td><input id="db-kat" placeholder="Engine"></td>`;
      ['db-p','db-l','db-t','db-b'].forEach(id=>{html+=`<td><input id="${id}" type="number" style="text-align:right;font-family:'IBM Plex Mono'"></td>`});
      html+=`<td style="text-align:center"><button class="btn btn-p btn-sm" onclick="dbAdd()">＋</button></td></tr></tbody></table></div></div>`;
    }

    // Table
    html+=`<div class="cd fi"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="cd-t" style="margin-bottom:0">Database (${f.length})</div><input id="db-search" placeholder="🔍 Cari..." value="${search}" style="background:var(--bg1);border:1px solid var(--b1);border-radius:var(--rs);padding:5px 8px;color:var(--t1);font-family:inherit;font-size:11px;width:180px"></div>`;
    html+=`<div style="overflow-x:auto"><table class="dtb"><thead><tr><th>PN</th><th>Nama</th><th>Brand</th><th>Kategori</th><th>P</th><th>L</th><th>T</th><th>Berat</th>${canEdit?'<th>×</th>':''}</tr></thead><tbody>`;
    f.forEach((p,i)=>{
      html+=`<tr><td><span class="mono" style="color:var(--cyan);font-weight:600;font-size:10px">${p.pn}</span></td><td style="font-weight:600;font-size:11px">${p.nama}</td><td style="color:var(--t3);font-size:10px">${p.brand}</td><td><span class="badge" style="background:rgba(167,139,250,.08);color:var(--purple);font-size:8px">${p.kategori}</span></td><td class="mono" style="font-size:10px">${p.panjang}</td><td class="mono" style="font-size:10px">${p.lebar}</td><td class="mono" style="font-size:10px">${p.tinggi}</td><td class="mono" style="font-size:10px">${p.berat}kg</td>${canEdit?`<td><button class="btn btn-d btn-sm" onclick="dbDel('${p.pn}')">✕</button></td>`:''}</tr>`;
    });
    html+=`</tbody></table></div></div>`;

    c.innerHTML=html;
    const si=document.getElementById('db-search');
    if(si)si.oninput=e=>{search=e.target.value;build()};
  }

  window.dbAdd=function(){
    const pn=document.getElementById('db-pn').value.trim();
    const nama=document.getElementById('db-nama').value.trim();
    if(!pn||!nama)return;
    PARTS_DB.push({pn,nama,brand:document.getElementById('db-brand').value.trim(),kategori:document.getElementById('db-kat').value.trim(),panjang:+document.getElementById('db-p').value||0,lebar:+document.getElementById('db-l').value||0,tinggi:+document.getElementById('db-t').value||0,berat:+document.getElementById('db-b').value||0});
    build();
  };

  window.dbDel=function(pn){PARTS_DB=PARTS_DB.filter(p=>p.pn!==pn);build()};

  window.dbExport=function(fmt){
    const f=PARTS_DB.filter(p=>!search||p.pn.toLowerCase().includes(search.toLowerCase())||p.nama.toLowerCase().includes(search.toLowerCase()));
    const h=["PN","Nama","Brand","Kategori","P","L","T","Berat"];
    const r=f.map(p=>[p.pn,p.nama,p.brand,p.kategori,p.panjang,p.lebar,p.tinggi,p.berat]);
    if(fmt==="CSV")exportCSV(h,r,"database_part");else if(fmt==="JSON")exportJSON(f,"database_part");else window.print();
    document.querySelectorAll('.export-dd.show').forEach(d=>d.classList.remove('show'));
  };

  build();
}
</script>
</body>
</html>
